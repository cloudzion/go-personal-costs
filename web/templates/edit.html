{{define "content"}}
    <h2>Редактировать трату #{{.EditExpense.ID}}</h2>
    <form action="/edit?id={{.EditExpense.ID}}" method="POST">
        <label>Сумма:</label>
        <input type="number" step="0.01" name="amount" value="{{.EditExpense.Amount}}" required>
        
        <label>Описание:</label>
        <input type="text" name="description" value="{{.EditExpense.Description}}" required>

        <label>Категория:</label>
        <select name="category_id" required style="padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
            {{$currentCatID := .EditExpense.CategoryID}}
            {{range .Categories}}
                <option value="{{.ID}}" {{if eq .ID $currentCatID}}selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
        
        <label>Дата:</label>
        <input type="date" name="date" value="{{.EditExpense.Date.Format "2006-01-02"}}" required>
        
        <button type="submit" style="background-color: #007bff;">Сохранить изменения</button>
        <a href="/" style="display: block; text-align: center; margin-top: 10px; color: #555;">Отмена</a>
    </form>
{{end}}
